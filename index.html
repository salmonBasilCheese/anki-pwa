<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <!-- viewport-fit=cover: ノッチの裏まで描画する(余白は env(safe-area-inset-*) で自分で避ける) -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>anki-pwa</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="theme-color" content="#1e1f22">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Anki">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <style>
    /* 色はここに集約。調整するときはこの変数だけ触る */
    :root {
      color-scheme: dark;            /* ブラウザ標準部品(スクロールバー等)もダークに */
      --bg: #1e1f22;                 /* 背景: 真っ黒ではない暗いグレー */
      --surface: #2a2c30;            /* カード・ボタンの面 */
      --surface-hover: #35383d;
      --surface-active: #3f4348;
      --border: #44474d;
      --text: #e2e0dc;               /* 本文: 少し柔らかい白 */
      --text-muted: #a3a6ad;         /* IPA・補足 */
      --text-faint: #7d8087;         /* ヒント */
      --accent: #8ab4f8;             /* 品詞(.pos)・フォーカス */
      --error: #f28b82;
      --danger: #f28b82;             /* 削除ボタンの文字・枠 */
      --again: #e57373;              /* 4つの回答ボタンの色 */
      --hard: #d9a05b;
      --good: #81c784;
      --easy: #64b5f6;
      --disabled-text: #6a6d73;
      --radius: 10px;
    }

    html { -webkit-text-size-adjust: 100%; touch-action: manipulation; /* ダブルタップ拡大を防ぐ */ }
    body {
      font-family: system-ui, -apple-system, "Hiragino Sans", "Yu Gothic UI", sans-serif;
      font-size: 18px; line-height: 1.6;
      background: var(--bg); color: var(--text);
      max-width: 640px; margin: 0 auto;
      /* 16px の余白 + ノッチ・ホームバーなどの安全領域(iPhone 以外では 0) */
      padding:
        calc(16px + env(safe-area-inset-top))
        calc(16px + env(safe-area-inset-right))
        calc(16px + env(safe-area-inset-bottom))
        calc(16px + env(safe-area-inset-left));
    }
    h1 { font-size: 1.3rem; margin: 0 0 12px; }
    #status { color: var(--text-muted); margin: 8px 0; }
    #status.error { color: var(--error); }
    #deck-info { font-weight: bold; margin: 12px 0; }
    h2 { font-size: 1.1rem; margin: 20px 0 8px; }
    #persist-status { color: var(--text-faint); font-size: 0.85rem; margin: 8px 0; }

    /* 保存済みデッキの一覧 */
    #deck-list { list-style: none; margin: 0; padding: 0; }
    #deck-list .empty { color: var(--text-muted); }
    .deck-row {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 12px 14px; margin-bottom: 10px;
    }
    .deck-name { font-weight: bold; }
    .deck-meta { color: var(--text-muted); font-size: 0.9rem; margin: 2px 0 10px; }
    .deck-actions { display: flex; gap: 10px; }
    .deck-actions .open { flex: 1; }
    button.danger { color: var(--danger); }
    #back-to-library { margin-bottom: 4px; }

    #card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 24px; min-height: 160px;
      cursor: pointer; user-select: none; -webkit-tap-highlight-color: transparent;
    }
    #front { font-size: 2.2rem; text-align: center; }
    #back { margin-top: 16px; border-top: 1px dashed var(--border); padding-top: 12px; }
    #back .field { margin: 10px 0; }
    .ipa { color: var(--text-muted); }
    .pos { margin: 2px 0; color: var(--accent); }   /* Meaning 内の <div class="pos"> */
    .exampleJA { color: var(--text-muted); }
    #audio-controls { margin: 14px 0; display: flex; gap: 10px; }

    /* 残り枚数 */
    #counts { display: flex; gap: 16px; color: var(--text-muted); margin: 4px 0 12px; }
    .count b { color: var(--text); font-variant-numeric: tabular-nums; }
    .count.current b { text-decoration: underline; text-underline-offset: 4px; }

    /* 答えを見る / 4つの回答ボタン: 画面下部に固定(親指で押しやすく、ホームバーに隠れない) */
    #study { padding-bottom: calc(120px + env(safe-area-inset-bottom)); } /* 固定バーに隠れない余白 */
    #action-bar {
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 10;
      background: var(--bg); border-top: 1px solid var(--border);
      padding:
        10px
        calc(16px + env(safe-area-inset-right))
        calc(10px + env(safe-area-inset-bottom))
        calc(16px + env(safe-area-inset-left));
    }
    #action-bar > * { max-width: 608px; margin: 0 auto; }
    #show-answer { display: block; width: 100%; min-height: 76px; font-size: 1.15rem; }
    #show-answer small { color: var(--text-faint); }
    #grades { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
    .grade {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 2px; padding: 8px 2px; min-height: 76px; font-size: 1.05rem;
    }
    .grade .interval { font-size: 0.95rem; color: var(--text-muted); font-variant-numeric: tabular-nums; }
    .grade.again .grade-label { color: var(--again); }
    .grade.hard .grade-label { color: var(--hard); }
    .grade.good .grade-label { color: var(--good); }
    .grade.easy .grade-label { color: var(--easy); }

    #done { text-align: center; padding: 32px 0; }
    #done-title { font-size: 1.3rem; margin: 0 0 8px; }
    #done-note { color: var(--text-muted); margin: 0; }

    /* 新規の1日の上限(一覧) */
    .deck-limit { display: flex; align-items: center; gap: 8px; margin: 0 0 10px; color: var(--text-muted); font-size: 0.9rem; }
    .deck-limit input {
      font: inherit; width: 5em; padding: 6px 8px; min-height: 40px;
      color: var(--text); background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius);
    }

    /* 新しいバージョンのお知らせ(Service Worker が更新を見つけたとき) */
    #update-banner {
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
      background: var(--surface); border: 1px solid var(--accent);
      border-radius: var(--radius); padding: 8px 8px 8px 14px; margin-bottom: 12px;
    }

    /* デバッグ用(?debug=1) */
    #debug {
      margin-top: 28px; padding: 10px 12px; border: 1px dashed var(--border);
      border-radius: var(--radius); color: var(--text-muted); font-size: 0.9rem;
    }
    #debug-buttons { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
    #debug-buttons button { min-height: 40px; padding: 6px 12px; font-size: 0.9rem; }

    /* ボタンとファイル選択: 指で押しやすい高さ(44px以上) */
    button, input[type="file"]::file-selector-button {
      font: inherit; color: var(--text);
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 10px 16px; min-height: 44px;
      cursor: pointer;
    }
    button:hover, input[type="file"]::file-selector-button:hover { background: var(--surface-hover); }
    button:active, input[type="file"]::file-selector-button:active { background: var(--surface-active); }
    button:focus-visible, input[type="file"]:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    button:disabled { color: var(--disabled-text); background: var(--bg); cursor: default; }
    input[type="file"] { font: inherit; color: var(--text-muted); max-width: 100%; }
    input[type="file"]::file-selector-button { margin-right: 12px; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <div id="update-banner" hidden>
    <span>新しいバージョンがあります</span>
    <button id="update-btn" type="button">更新</button>
  </div>
  <h1>anki-pwa</h1>
  <div id="status"></div>

  <div id="library">
    <input type="file" id="file" accept=".apkg">
    <div id="persist-status"></div>
    <h2>保存済みデッキ</h2>
    <ul id="deck-list"></ul>
  </div>

  <div id="viewer" hidden>
    <button id="back-to-library" type="button">← 一覧へ戻る</button>
    <div id="deck-info"></div>
    <div id="counts">
      <span class="count" data-kind="new">新規 <b id="count-new">0</b></span>
      <span class="count" data-kind="learning">学習中 <b id="count-learning">0</b></span>
      <span class="count" data-kind="review">復習 <b id="count-review">0</b></span>
    </div>

    <div id="study">
      <div id="card">
        <div id="front"></div>
        <div id="back" hidden></div>
      </div>
      <div id="audio-controls">
        <button id="play-word" type="button">単語を再生</button>
        <button id="play-example" type="button">例文を再生</button>
      </div>
      <div id="action-bar">
        <button id="show-answer" type="button">答えを見る <small>(Space)</small></button>
        <div id="grades" hidden>
          <button type="button" class="grade again" data-grade="1"><span class="interval"></span><span class="grade-label">もう一度</span></button>
          <button type="button" class="grade hard" data-grade="2"><span class="interval"></span><span class="grade-label">難しい</span></button>
          <button type="button" class="grade good" data-grade="3"><span class="interval"></span><span class="grade-label">正解</span></button>
          <button type="button" class="grade easy" data-grade="4"><span class="interval"></span><span class="grade-label">簡単</span></button>
        </div>
      </div>
    </div>

    <div id="done" hidden>
      <p id="done-title">今日の学習は終わりです</p>
      <p id="done-note"></p>
    </div>
  </div>

  <!-- ?debug=1 のときだけ表示される、動作確認用の時刻操作 -->
  <div id="debug" hidden>
    <div id="debug-clock"></div>
    <div id="debug-buttons">
      <button type="button" data-add-ms="3600000">+1時間</button>
      <button type="button" data-add-ms="86400000">+1日</button>
      <button type="button" data-add-ms="604800000">+7日</button>
      <button type="button" data-reset="1">リセット</button>
    </div>
  </div>

  <script src="lib/jszip.min.js"></script>
  <script src="lib/sql-wasm.js"></script>
  <script src="lib/purify.min.js"></script>
  <script src="lib/ts-fsrs.umd.js"></script>
  <script src="storage.js"></script>
  <script src="srs.js"></script>
  <script src="app.js"></script>
</body>
</html>
