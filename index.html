<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <!--
    viewport-fit=cover : ノッチの裏まで描画する(余白は env(safe-area-inset-*) で自分で避ける)
    maximum-scale=1    : ピンチ・フォーカスでの拡大を抑える(iPhone で画面が拡大されたまま戻らない問題の保険)
  -->
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <title>anki-pwa</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="theme-color" content="#1e1f22">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Anki">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <style>
    /* 色はここに集約。調整するときはこの変数だけ触る */
    :root {
      color-scheme: dark;            /* ブラウザ標準部品(スクロールバー等)もダークに */
      --bg: #1e1f22;                 /* 背景: 真っ黒ではない暗いグレー */
      --surface: #2a2c30;            /* カード・ボタンの面 */
      --surface-hover: #35383d;
      --surface-active: #3f4348;
      --border: #44474d;
      --text: #e2e0dc;               /* 本文: 少し柔らかい白 */
      --text-muted: #a3a6ad;         /* IPA・補足 */
      --text-faint: #7d8087;         /* ヒント */
      --accent: #8ab4f8;             /* 品詞(.pos)・フォーカス・音声ボタン */
      --error: #f28b82;
      --danger: #f28b82;             /* 削除ボタンの文字・枠 */
      --again: #e57373;              /* 4つの回答ボタンの色 */
      --hard: #d9a05b;
      --good: #81c784;
      --easy: #64b5f6;
      --disabled-text: #6a6d73;
      --radius: 10px;
    }

    /* 横にはみ出す原因になりやすいので、全要素で padding・border を幅に含める */
    *, *::before, *::after { box-sizing: border-box; }

    html { -webkit-text-size-adjust: 100%; touch-action: manipulation; /* ダブルタップ拡大を防ぐ */ }

    /*
      画面全体を1枚として使う: 上から「ヘッダー → カード(ここだけスクロール) → 下部の回答ボタン」。
      100vh だと iPhone のバーの分だけ高さがずれるので、dvh を優先する(未対応なら vh)。
    */
    body {
      margin: 0 auto; max-width: 640px;
      height: 100vh; height: 100dvh;
      display: flex; flex-direction: column;
      overflow: hidden;
      font-family: system-ui, -apple-system, "Hiragino Sans", "Yu Gothic UI", sans-serif;
      font-size: 18px; line-height: 1.6;
      background: var(--bg); color: var(--text);
      /* 余白 + ノッチなどの安全領域(iPhone 以外では 0)。下の安全領域は各画面の下端で足す */
      padding:
        calc(10px + env(safe-area-inset-top))
        calc(16px + env(safe-area-inset-right))
        0
        calc(16px + env(safe-area-inset-left));
    }
    h1 { font-size: 1.3rem; margin: 0 0 10px; }
    h2 { font-size: 1.1rem; margin: 20px 0 8px; }
    #status { flex: none; color: var(--text-muted); margin: 6px 0; }
    #status:empty { display: none; }
    #status.error { color: var(--error); }

    /* ---------- 一覧画面 ---------- */
    #library {
      flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain;
      padding-bottom: calc(16px + env(safe-area-inset-bottom));
    }
    #persist-status { color: var(--text-faint); font-size: 0.85rem; margin: 8px 0; }
    #app-version { color: var(--text-faint); font-size: 0.85rem; margin: 16px 0 0; }
    #backup-last { color: var(--text-muted); font-size: 0.9rem; margin: 0 0 10px; }
    #backup-actions { display: flex; gap: 10px; }
    #backup-actions button { flex: 1; }
    #backup-result { white-space: pre-line; overflow-wrap: anywhere; color: var(--text-muted); font-size: 0.9rem; margin: 10px 0 0; }
    #backup-result:empty { display: none; }
    #deck-list { list-style: none; margin: 0; padding: 0; }
    #deck-list .empty { color: var(--text-muted); }
    .deck-row {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 12px 14px; margin-bottom: 10px;
      overflow-wrap: anywhere;
    }
    .deck-name { font-weight: bold; }
    .deck-meta { color: var(--text-muted); font-size: 0.9rem; margin: 2px 0 10px; }
    .deck-actions { display: flex; gap: 10px; }
    .deck-actions .open { flex: 1; }
    button.danger { color: var(--danger); }

    /* 新規の1日の上限。iOS は 16px 未満の入力欄にフォーカスすると画面を自動で拡大するので 16px にする */
    .deck-limit { display: flex; align-items: center; gap: 8px; margin: 0 0 10px; color: var(--text-muted); font-size: 0.9rem; }
    .deck-limit input {
      font: inherit; font-size: 16px; width: 5.5em; padding: 6px 8px; min-height: 40px;
      color: var(--text); background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius);
    }
    input:not([type="file"]), select, textarea { font-size: 16px; }

    /* ---------- 学習画面 ---------- */
    #viewer { flex: 1; min-height: 0; display: flex; flex-direction: column; }
    #viewer-header { flex: none; }
    #viewer-top { display: flex; align-items: center; gap: 10px; }
    #back-to-library { flex: none; min-height: 40px; padding: 6px 12px; font-size: 1rem; }
    #deck-info {
      flex: 1; min-width: 0; margin: 0; font-weight: bold; font-size: 1rem;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    #counts { display: flex; gap: 16px; color: var(--text-muted); font-size: 0.95rem; margin: 2px 0 8px; }
    .count b { color: var(--text); font-variant-numeric: tabular-nums; }
    .count.current b { text-decoration: underline; text-underline-offset: 4px; }

    #study { flex: 1; min-height: 0; display: flex; flex-direction: column; }

    /* カード: 内容が長いときはここだけがスクロールする */
    #card {
      flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain;
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 18px 16px;
      cursor: pointer; -webkit-tap-highlight-color: transparent;
      overflow-wrap: break-word; overflow-wrap: anywhere;   /* 長い単語で横にはみ出さない */
    }
    #card img, #card table, #card video { max-width: 100%; height: auto; }
    #front { font-size: 2rem; line-height: 1.3; text-align: center; }
    #back { margin-top: 14px; border-top: 1px dashed var(--border); padding-top: 10px; }
    #back .field { margin: 10px 0; }
    .ipa { color: var(--text-muted); }
    .pos { margin: 2px 0; color: var(--accent); }   /* Meaning 内の <div class="pos"> */
    .exampleJA { color: var(--text-muted); }

    /* 見出し語・例文の横に置く、小さな音声ボタン */
    .field.headword.with-audio { display: flex; justify-content: center; align-items: center; gap: 10px; }
    .field.exampleEN.with-audio { display: flex; align-items: flex-start; gap: 8px; }
    .with-audio .text { min-width: 0; }
    .field.exampleEN .text { flex: 1; }
    .audio-btn {
      flex: none; width: 40px; height: 40px; min-height: 0; padding: 0; border-radius: 50%;
      display: inline-flex; align-items: center; justify-content: center; color: var(--accent);
    }
    .audio-btn svg { width: 20px; height: 20px; pointer-events: none; }

    /* 答えを見る / 4つの回答ボタン: 画面の下端(親指の位置)。ホームバーの分は余白で避ける */
    #action-bar {
      flex: none; margin-top: 10px; padding-top: 10px;
      padding-bottom: calc(10px + env(safe-area-inset-bottom));
      border-top: 1px solid var(--border);
    }
    #show-answer { display: block; width: 100%; min-height: 76px; font-size: 1.15rem; }
    /* キーボード操作の表記は、マウスのある環境(PC)でだけ出す */
    .kbd-hint { display: none; color: var(--text-faint); }
    @media (hover: hover) and (pointer: fine) { .kbd-hint { display: inline; } }
    /* minmax(0, 1fr): 中身の長さで列が広がって、横にはみ出さないようにする */
    #grades { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
    .grade {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 2px; padding: 8px 2px; min-width: 0; min-height: 76px; font-size: 1.05rem; white-space: nowrap;
    }
    .grade .interval { font-size: 0.95rem; color: var(--text-muted); font-variant-numeric: tabular-nums; }
    .grade.again .grade-label { color: var(--again); }
    .grade.hard .grade-label { color: var(--hard); }
    .grade.good .grade-label { color: var(--good); }
    .grade.easy .grade-label { color: var(--easy); }

    #done {
      flex: 1; min-height: 0; overflow-y: auto; text-align: center; padding: 32px 0;
      padding-bottom: calc(32px + env(safe-area-inset-bottom));
    }
    #done-title { font-size: 1.3rem; margin: 0 0 8px; }
    #done-note { color: var(--text-muted); margin: 0; }

    /* 新しいバージョンのお知らせ(Service Worker が更新を見つけたとき) */
    #update-banner {
      flex: none; display: flex; align-items: center; justify-content: space-between; gap: 12px;
      background: var(--surface); border: 1px solid var(--accent);
      border-radius: var(--radius); padding: 8px 8px 8px 14px; margin-bottom: 10px;
    }

    /* デバッグ用(?debug=1) */
    #debug {
      flex: none; margin: 8px 0 calc(8px + env(safe-area-inset-bottom)); padding: 8px 12px;
      border: 1px dashed var(--border); border-radius: var(--radius);
      color: var(--text-muted); font-size: 0.85rem; overflow-wrap: anywhere;
    }
    #debug-buttons { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 6px; }
    #debug-buttons button { min-height: 40px; padding: 6px 12px; font-size: 0.9rem; }

    /* ボタンとファイル選択: 指で押しやすい高さ(44px以上) */
    button, input[type="file"]::file-selector-button {
      font: inherit; color: var(--text);
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 10px 16px; min-height: 44px;
      cursor: pointer;
    }
    button:hover, input[type="file"]::file-selector-button:hover { background: var(--surface-hover); }
    button:active, input[type="file"]::file-selector-button:active { background: var(--surface-active); }
    button:focus-visible, input[type="file"]:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    button:disabled { color: var(--disabled-text); background: var(--bg); cursor: default; }
    input[type="file"] { font: inherit; color: var(--text-muted); max-width: 100%; }
    input[type="file"]::file-selector-button { margin-right: 12px; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <div id="update-banner" hidden>
    <span>新しいバージョンがあります</span>
    <button id="update-btn" type="button">更新</button>
  </div>
  <div id="status"></div>

  <div id="library">
    <h1>anki-pwa</h1>
    <input type="file" id="file" accept=".apkg">
    <div id="persist-status"></div>
    <h2>保存済みデッキ</h2>
    <ul id="deck-list"></ul>
    <h2>バックアップ</h2>
    <div id="backup-last"></div>
    <div id="backup-actions">
      <button type="button" id="backup-export">書き出す</button>
      <button type="button" id="backup-import">読み込む</button>
    </div>
    <input type="file" id="backup-file" accept=".json,application/json" hidden>
    <div id="backup-result"></div>
    <div id="app-version"></div>
  </div>

  <div id="viewer" hidden>
    <div id="viewer-header">
      <div id="viewer-top">
        <button id="back-to-library" type="button">← 一覧</button>
        <div id="deck-info"></div>
      </div>
      <div id="counts">
        <span class="count" data-kind="new">新規 <b id="count-new">0</b></span>
        <span class="count" data-kind="learning">学習中 <b id="count-learning">0</b></span>
        <span class="count" data-kind="review">復習 <b id="count-review">0</b></span>
      </div>
    </div>

    <div id="study">
      <div id="card">
        <div id="front"></div>
        <div id="back" hidden></div>
      </div>
      <div id="action-bar">
        <button id="show-answer" type="button">答えを見る <small class="kbd-hint">(Space)</small></button>
        <div id="grades" hidden>
          <button type="button" class="grade again" data-grade="1"><span class="interval"></span><span class="grade-label">もう一度</span></button>
          <button type="button" class="grade hard" data-grade="2"><span class="interval"></span><span class="grade-label">難しい</span></button>
          <button type="button" class="grade good" data-grade="3"><span class="interval"></span><span class="grade-label">正解</span></button>
          <button type="button" class="grade easy" data-grade="4"><span class="interval"></span><span class="grade-label">簡単</span></button>
        </div>
      </div>
    </div>

    <div id="done" hidden>
      <p id="done-title">今日の学習は終わりです</p>
      <p id="done-note"></p>
    </div>
  </div>

  <!-- ?debug=1 のときだけ表示される、動作確認用の時刻操作と画面幅の表示 -->
  <div id="debug" hidden>
    <div id="debug-clock"></div>
    <div id="debug-viewport"></div>
    <div id="debug-buttons">
      <button type="button" data-add-ms="3600000">+1時間</button>
      <button type="button" data-add-ms="86400000">+1日</button>
      <button type="button" data-add-ms="604800000">+7日</button>
      <button type="button" data-reset="1">リセット</button>
    </div>
  </div>

  <script src="lib/jszip.min.js"></script>
  <script src="lib/sql-wasm.js"></script>
  <script src="lib/purify.min.js"></script>
  <script src="lib/ts-fsrs.umd.js"></script>
  <script src="backup.js"></script>
  <script src="storage.js"></script>
  <script src="srs.js"></script>
  <script src="app.js"></script>
</body>
</html>
